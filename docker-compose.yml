services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: sentinel-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel}
      POSTGRES_DB: ${POSTGRES_DB:-sentinel_fleet}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init-postgis.sql:/docker-entrypoint-initdb.d/01-init-postgis.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel} -d ${POSTGRES_DB:-sentinel_fleet}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sentinel-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: sentinel-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-sentinel}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-sentinel}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: sentinel-api
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=${POSTGRES_DB:-sentinel_fleet};Username=${POSTGRES_USER:-sentinel};Password=${POSTGRES_PASSWORD:-sentinel}
      ConnectionStrings__Redis: redis:6379
      ConnectionStrings__RabbitMq: amqp://${RABBITMQ_USER:-sentinel}:${RABBITMQ_PASSWORD:-sentinel}@rabbitmq:5672/
      Serilog__MinimumLevel: ${Serilog__MinimumLevel:-Information}
      Jwt__Issuer: ${Jwt__Issuer:-sentinel-fleet}
      Jwt__Audience: ${Jwt__Audience:-sentinel-fleet}
      Jwt__SigningKey: ${Jwt__SigningKey:-CHANGE_ME_local_dev_signing_key_min_32_chars!}
      Jwt__AccessTokenMinutes: ${Jwt__AccessTokenMinutes:-15}
      Jwt__RefreshTokenDays: ${Jwt__RefreshTokenDays:-7}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: sentinel-web
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy

  simulator:
    profiles: ["demo"]
    build:
      context: ./apps/simulator
      dockerfile: Dockerfile
    container_name: sentinel-simulator
    environment:
      API_BASE: http://api:8080
      SF_EMAIL: ${SF_SIM_EMAIL:-simulator@sentinel.local}
      SF_PASSWORD: ${SF_SIM_PASSWORD:-Simulator123!}
      SF_ORG_NAME: ${SF_SIM_ORG:-Simulator Fleet AS}
      SF_VEHICLE_COUNT: ${SF_VEHICLE_COUNT:-20}
      SF_INTERVAL_SEC: ${SF_INTERVAL_SEC:-3}
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
